name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Dependency Review
        uses: actions/dependency-review-action@v4 # replace with the current published v4 commit SHA
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: true
